<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        #loginForm {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
        
        #container {
            display: none;
            background-color: #e8f5e8;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #4CAF50;
        }
        
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin: 10px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Protected Page Access</h2>
        <p>Please enter the password to view protected content:</p>
        <form id="passwordForm">
            <input type="password" id="passwordInput" placeholder="Enter Password" required>
            <br>
            <button type="button" onclick="validatePassword()">Access Content</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>
    
    <div id="container">
        <h2>? Access Granted!</h2>
        <h3>Welcome to TutorialsPoint Protected Content</h3>
        <p>This is your protected content that is now visible after successful authentication.</p>
        <p>You can add any sensitive information or premium content here.</p>
        <button onclick="logout()">Logout</button>
    </div>
    
    <script>
        const correctPassword = "SecurePass123";
        
        function validatePassword() {
            const inputPassword = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMsg");
            
            if (inputPassword === correctPassword) {
                // Hide login form and show protected content
                document.getElementById("loginForm").style.display = "none";
                document.getElementById("container").style.display = "block";
                errorMsg.textContent = "";
            } else {
                // Show error message
                errorMsg.textContent = "Incorrect password! Please try again.";
                document.getElementById("passwordInput").value = "";
                document.getElementById("passwordInput").focus();
            }
        }
        
        function logout() {
            // Hide protected content and show login form
            document.getElementById("container").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("passwordInput").value = "";
        }
        
        // Allow Enter key to submit
        document.getElementById("passwordInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                validatePassword();
            }
        });
    </script>
</body>
</html>
